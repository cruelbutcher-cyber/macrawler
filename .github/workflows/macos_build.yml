name: Build macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pyinstaller requests beautifulsoup4 tldextract lxml

      - name: Build macOS App with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name "aCrawler" acrawler.py

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "aCrawler" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "aCrawler.app" 175 120 \
            --hide-extension "aCrawler.app" \
            --app-drop-link 425 120 \
            "aCrawler-macOS.dmg" \
            "dist/aCrawler.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aCrawler-macOS
          path: aCrawler-macOS.dmg
